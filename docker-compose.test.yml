version: '3.8'

services:
  # 应用服务（前端+后端）
  app:
    image: similator-equip:test
    container_name: game-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=mysql
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=game
      - MYSQL_PASSWORD=game123456
      - MYSQL_DATABASE=game
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - game-network

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: game-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: game123456
      MYSQL_DATABASE: game
      MYSQL_USER: game
      MYSQL_PASSWORD: game123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init-db:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: game-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - game-network

networks:
  game-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: